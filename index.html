<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vây 9x9 - Thi Đấu Chuẩn</title>
    <style>
        body {
            background-color: #18181f;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
            user-select: none;
            min-height: 96vh;
        }
        .hud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: rgba(35, 35, 46, 0.92);
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .stat-box { background: #14141b; padding: 6px 12px; border-radius: 6px; font-size: 14px; border: 1px solid #333; }
        .clock-box {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            background: #14141b;
            border: 2px solid #333;
            transition: 0.2s;
        }
        .clock-active { border-color: #f5b041; color: #f5b041; box-shadow: 0 0 10px rgba(245,176,65,0.35); }
        .clock-danger {
            border-color: #e74c3c !important;
            background: #5c1916 !important;
            color: #fff !important;
            animation: pulseRed 0.7s infinite alternate;
        }
        @keyframes pulseRed {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        canvas {
            box-shadow: 0 12px 35px rgba(0,0,0,0.85);
            cursor: pointer;
            max-width: 90vw;
            max-height: 78vh;
            border-radius: 8px;
        }
        button { padding: 7px 13px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-pass { background: #f39c12; color: #000; }
        .btn-resign { background: #e74c3c; color: #fff; }
        .btn-setting-corner {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2b2b36;
            color: #f5b041;
            border: 2px solid #f5b041;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            z-index: 950;
            transition: transform 0.2s;
        }
        .btn-setting-corner:hover { transform: rotate(45deg) scale(1.08); }
        .setting-popup {
            position: fixed;
            bottom: 76px;
            right: 16px;
            width: 390px;
            height: 440px;
            max-width: 92vw;
            max-height: 80vh;
            background: #1e1e26;
            border: 2px solid #f5b041;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
            z-index: 960;
            overflow: hidden;
        }
        .setting-popup iframe { width: 100%; height: 100%; border: none; }
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="stat-box" id="playerLabel">Chế độ: 2 người (1 máy)</div>
        <div class="clock-box clock-active" id="blackClockBox">⚫ Đen: 05:00</div>
        <div class="clock-box" id="whiteClockBox">⚪ Trắng: 05:00</div>
        <div class="stat-box">Tù binh — Đen: <strong id="blackCap">0</strong> | Trắng: <strong id="whiteCap">0</strong></div>
        <button class="btn-pass" onclick="handlePass()">Bỏ Lượt</button>
        <button class="btn-resign" onclick="handleResign()">Đầu Hàng</button>
    </div>

    <canvas id="goCanvas" width="1000" height="1000"></canvas>

    <!-- NÚT MỞ BẢNG SETTING GÓC DƯỚI PHẢI -->
    <button class="btn-setting-corner" title="Cài đặt âm thanh & giao diện" onclick="toggleSettingPanel()">⚙️</button>

    <!-- KHUNG SETTING NỔI TẠI CHỖ (LOAD INDEX2.HTML) -->
    <div class="setting-popup hidden" id="settingPopup">
        <iframe src="/index2.html" id="settingFrame"></iframe>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div class="overlay hidden" id="endOverlay">
        <h1 id="endTitle" style="font-size: 46px; margin-bottom: 8px;"></h1>
        <p id="endReason" style="font-size: 19px; color: #ccc; margin-bottom: 24px;"></p>
        <button onclick="exitMatch()" style="padding: 12px 26px; font-size: 16px; background: #2ecc71; color: #000;">Quay về sảnh</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('goCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 9;
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
        const INITIAL_TIME = 300; // 5 phút = 300 giây

        const username = sessionStorage.getItem('go_username');
        const roomId = sessionStorage.getItem('go_roomId');
        const myColor = Number(sessionStorage.getItem('go_color') || 0);
        const opponent = sessionStorage.getItem('go_opponent') || 'Đối thủ';
        const isOnline = Boolean(username && roomId && typeof io !== 'undefined');
        const socket = isOnline ? io() : null;

        if (isOnline) {
            document.getElementById('playerLabel').innerText = `${username} (${myColor === 1 ? 'Đen' : 'Trắng'}) vs ${opponent}`;
        }

        // --- QUẢN LÝ SETTING (ÂM LƯỢNG, NHẠC NỀN, BACKGROUND) ---
        let sfxVolume = Number(localStorage.getItem('go_sfx_vol') ?? 100) / 100;
        let bgmVolume = Number(localStorage.getItem('go_bgm_vol') ?? 60) / 100;
        const bgmAudio = new Audio();
        bgmAudio.loop = true;

        function applySavedSettings() {
            sfxVolume = Number(localStorage.getItem('go_sfx_vol') ?? 100) / 100;
            bgmVolume = Number(localStorage.getItem('go_bgm_vol') ?? 60) / 100;
            bgmAudio.volume = bgmVolume;

            const savedBg = localStorage.getItem('go_custom_bg');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            const savedBgm = localStorage.getItem('go_custom_bgm');
            if (savedBgm && bgmAudio.src !== savedBgm) {
                bgmAudio.src = savedBgm;
                bgmAudio.play().catch(() => {});
            } else if (!savedBgm) {
                bgmAudio.pause();
                bgmAudio.removeAttribute('src');
            }
        }
        applySavedSettings();

        function toggleSettingPanel() {
            const box = document.getElementById('settingPopup');
            box.classList.toggle('hidden');
        }

        window.addEventListener('message', (e) => {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'updateSettings') {
                applySavedSettings();
                if (e.data.testSfx) playMoveSound();
            } else if (e.data.type === 'closeSettings') {
                document.getElementById('settingPopup').classList.add('hidden');
            }
        });

        // --- ÂM THANH ĐẶT QUÂN ---
        const moveSound = new Audio('/sound.mp3');
        let audioCtx = null;

        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (bgmAudio.src && bgmAudio.paused) bgmAudio.play().catch(() => {});
        }
        document.addEventListener('pointerdown', unlockAudio, { once: true });

        function playSynthClack() {
            if (sfxVolume <= 0) return;
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(920, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.055);
            gain.gain.setValueAtTime(0.8 * sfxVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.065);
        }

        function playMoveSound() {
            if (sfxVolume <= 0) return;
            moveSound.volume = sfxVolume;
            moveSound.currentTime = 0;
            const p = moveSound.play();
            if (p !== undefined) p.catch(() => playSynthClack());
        }

        // --- TRẠNG THÁI VÁN CỜ & ĐỒNG HỒ 5 PHÚT ---
        let board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        let prevBoard = null;
        let currentTurn = 1;
        let captures = { 1: 0, 2: 0 };
        let lastMove = null;
        let passCount = 0;
        let isGameOver = false;
        let hoverPoint = null;

        // Quỹ thời gian (giây) & mốc đồng bộ server/local
        let timeLeft = { 1: INITIAL_TIME, 2: INITIAL_TIME };
        let lastTurnStartTimestamp = Date.now();

        // Lưu/Khôi phục trạng thái offline khi F5
        const LOCAL_STATE_KEY = 'go_local_match_state_v2';
        function saveLocalState() {
            if (isOnline || isGameOver) return;
            localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify({
                board, prevBoard, currentTurn, captures, lastMove, passCount,
                timeLeft, lastTurnStartTimestamp
            }));
        }

        function loadLocalState() {
            if (isOnline) return;
            try {
                const raw = localStorage.getItem(LOCAL_STATE_KEY);
                if (!raw) return;
                const s = JSON.parse(raw);
                if (s && s.board && s.timeLeft) {
                    board = s.board;
                    prevBoard = s.prevBoard;
                    currentTurn = s.currentTurn;
                    captures = s.captures;
                    lastMove = s.lastMove;
                    passCount = s.passCount;
                    timeLeft = s.timeLeft;
                    lastTurnStartTimestamp = s.lastTurnStartTimestamp || Date.now();
                }
            } catch (err) {}
        }
        loadLocalState();

        function formatClock(sec) {
            const s = Math.max(0, Math.ceil(sec));
            if (s <= 30 && s > 0) return `⏳ Đếm ngược: ${s}s`;
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        }

        function renderClocks() {
            const elapsed = (Date.now() - lastTurnStartTimestamp) / 1000;
            let liveBlack = currentTurn === 1 && !isGameOver ? Math.max(0, timeLeft[1] - elapsed) : timeLeft[1];
            let liveWhite = currentTurn === 2 && !isGameOver ? Math.max(0, timeLeft[2] - elapsed) : timeLeft[2];

            const bBox = document.getElementById('blackClockBox');
            const wBox = document.getElementById('whiteClockBox');

            bBox.innerText = `⚫ Đen: ${formatClock(liveBlack)}`;
            wBox.innerText = `⚪ Trắng: ${formatClock(liveWhite)}`;

            bBox.className = 'clock-box' + (!isGameOver && currentTurn === 1 ? ' clock-active' : '') + (!isGameOver && currentTurn === 1 && liveBlack <= 30 ? ' clock-danger' : '');
            wBox.className = 'clock-box' + (!isGameOver && currentTurn === 2 ? ' clock-active' : '') + (!isGameOver && currentTurn === 2 && liveWhite <= 30 ? ' clock-danger' : '');

            // Kiểm tra hết giờ ngay trên client (kể cả khi mạng trễ hoặc đang chơi 1 máy)
            if (!isGameOver) {
                if (currentTurn === 1 && liveBlack <= 0) {
                    timeLeft[1] = 0;
                    triggerTimeoutEnd(2, 1);
                } else if (currentTurn === 2 && liveWhite <= 0) {
                    timeLeft[2] = 0;
                    triggerTimeoutEnd(1, 2);
                }
            }
        }

        function triggerTimeoutEnd(winnerColor, loserColor) {
            if (isGameOver) return;
            isGameOver = true;
            localStorage.removeItem(LOCAL_STATE_KEY);
            if (isOnline) {
                socket.emit('claimTimeout', { roomId, loserColor });
            } else {
                const winText = winnerColor === 1 ? 'QUÂN ĐEN THẮNG!' : 'QUÂN TRẮNG THẮNG!';
                const loseName = loserColor === 1 ? 'Quân Đen' : 'Quân Trắng';
                showEndScreen(winText, `${loseName} đã hết 5 phút thời gian!`, true);
            }
        }

        // Vòng lặp cập nhật đồng hồ mượt mỗi 200ms
        setInterval(renderClocks, 200);

        // --- VẼ BÀN CỜ GỖ 9x9 ---
        const woodImg = new Image();
        let woodLoaded = false;
        woodImg.onload = () => { woodLoaded = true; drawBoard(); };
        woodImg.src = '/wood.png';

        const MARGIN = 115;
        const BOARD_SPAN = canvas.width - MARGIN * 2;
        const STEP = BOARD_SPAN / (GRID_SIZE - 1);
        const STONE_RADIUS = STEP * 0.43;

        function getCoord(col, row) {
            return { x: MARGIN + col * STEP, y: MARGIN + row * STEP };
        }

        function drawStone(x, y, color, isGhost = false) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, STONE_RADIUS, 0, Math.PI * 2);

            if (isGhost) {
                ctx.fillStyle = color === 1 ? 'rgba(20, 20, 20, 0.4)' : 'rgba(250, 250, 250, 0.55)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                ctx.stroke();
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
                ctx.shadowBlur = STONE_RADIUS * 0.28;
                ctx.shadowOffsetX = STONE_RADIUS * 0.1;
                ctx.shadowOffsetY = STONE_RADIUS * 0.14;

                const grad = ctx.createRadialGradient(
                    x - STONE_RADIUS * 0.3, y - STONE_RADIUS * 0.3, STONE_RADIUS * 0.1,
                    x, y, STONE_RADIUS
                );
                if (color === 1) {
                    grad.addColorStop(0, '#555555');
                    grad.addColorStop(0.35, '#1c1c1c');
                    grad.addColorStop(1, '#050505');
                } else {
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.75, '#eaeaea');
                    grad.addColorStop(1, '#bdbdbd');
                }
                ctx.fillStyle = grad;
                ctx.fill();
            }
            ctx.restore();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (woodLoaded) {
                ctx.drawImage(woodImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#d4a359';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const outerPad = 46;
            ctx.save();
            ctx.strokeStyle = '#1a120b';
            ctx.lineWidth = 4;
            ctx.strokeRect(MARGIN - outerPad, MARGIN - outerPad, BOARD_SPAN + outerPad * 2, BOARD_SPAN + outerPad * 2);

            ctx.lineWidth = 2.4;
            for (let i = 0; i < GRID_SIZE; i++) {
                const pos = MARGIN + i * STEP;
                ctx.beginPath();
                ctx.moveTo(MARGIN, pos);
                ctx.lineTo(MARGIN + BOARD_SPAN, pos);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(pos, MARGIN);
                ctx.lineTo(pos, MARGIN + BOARD_SPAN);
                ctx.stroke();
            }

            const starPoints = [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]];
            ctx.fillStyle = '#1a120b';
            for (const [sc, sr] of starPoints) {
                const pt = getCoord(sc, sr);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 6.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#1a120b';
            ctx.font = 'bold 21px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < GRID_SIZE; i++) {
                const pos = MARGIN + i * STEP;
                ctx.fillText(LETTERS[i], pos, MARGIN - outerPad - 22);
                ctx.fillText(LETTERS[i], pos, MARGIN + BOARD_SPAN + outerPad + 22);
                const rowNum = String(GRID_SIZE - i);
                ctx.fillText(rowNum, MARGIN - outerPad - 24, pos);
                ctx.fillText(rowNum, MARGIN + BOARD_SPAN + outerPad + 24, pos);
            }
            ctx.restore();

            if (!isGameOver && hoverPoint && board[hoverPoint.col][hoverPoint.row] === 0) {
                const pt = getCoord(hoverPoint.col, hoverPoint.row);
                drawStone(pt.x, pt.y, currentTurn, true);
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    const stone = board[c][r];
                    if (stone !== 0) {
                        const pt = getCoord(c, r);
                        drawStone(pt.x, pt.y, stone, false);

                        if (lastMove && lastMove.col === c && lastMove.row === r) {
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, STONE_RADIUS * 0.25, 0, Math.PI * 2);
                            ctx.fillStyle = '#e74c3c';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        function getNearestCell(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);
            const minBound = MARGIN - STEP * 0.75;
            const maxBound = MARGIN + BOARD_SPAN + STEP * 0.75;
            if (x < minBound || x > maxBound || y < minBound || y > maxBound) return null;

            const col = Math.max(0, Math.min(GRID_SIZE - 1, Math.round((x - MARGIN) / STEP)));
            const row = Math.max(0, Math.min(GRID_SIZE - 1, Math.round((y - MARGIN) / STEP)));
            return { col, row };
        }

        canvas.addEventListener('mousemove', (e) => {
            if (isGameOver || (isOnline && currentTurn !== myColor)) {
                hoverPoint = null;
                return;
            }
            const cell = getNearestCell(e.clientX, e.clientY);
            if (JSON.stringify(cell) !== JSON.stringify(hoverPoint)) {
                hoverPoint = cell;
                drawBoard();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoverPoint = null;
            drawBoard();
        });

        canvas.addEventListener('click', (e) => {
            if (isGameOver || (isOnline && currentTurn !== myColor)) return;
            const cell = getNearestCell(e.clientX, e.clientY);
            if (!cell) return;

            if (isOnline) {
                socket.emit('playMove', { roomId, col: cell.col, row: cell.row, username });
            } else {
                const res = executeMove(cell.col, cell.row, currentTurn);
                if (!res.ok) return alert(res.msg);
                playMoveSound();
                hoverPoint = null;
                updateUI();
                drawBoard();

                if (!hasAnyLegalMove(currentTurn)) {
                    isGameOver = true;
                    localStorage.removeItem(LOCAL_STATE_KEY);
                    const winnerText = currentTurn === 1 ? 'QUÂN TRẮNG THẮNG!' : 'QUÂN ĐEN THẮNG!';
                    const loserName = currentTurn === 1 ? 'Quân Đen' : 'Quân Trắng';
                    showEndScreen(winnerText, `${loserName} không còn nước đi hợp lệ!`, true);
                } else {
                    saveLocalState();
                }
            }
        });

        // --- LUẬT CỜ VÂY CHUẨN ---
        const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        const cloneBoard = (b) => b.map(r => [...r]);
        const isSameBoard = (b1, b2) => b1 && b2 && JSON.stringify(b1) === JSON.stringify(b2);

        function getGroupAndLiberties(targetBoard, startCol, startRow) {
            const color = targetBoard[startCol][startRow];
            const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
            const group = [];
            const liberties = new Set();
            const queue = [[startCol, startRow]];
            visited[startCol][startRow] = true;

            while (queue.length > 0) {
                const [c, r] = queue.shift();
                group.push([c, r]);
                for (const [dc, dr] of DIRS) {
                    const nc = c + dc, nr = r + dr;
                    if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE) {
                        if (targetBoard[nc][nr] === 0) liberties.add(`${nc},${nr}`);
                        else if (targetBoard[nc][nr] === color && !visited[nc][nr]) {
                            visited[nc][nr] = true;
                            queue.push([nc, nr]);
                        }
                    }
                }
            }
            return { group, liberties: liberties.size };
        }

        function simulateMove(srcBoard, srcPrevBoard, col, row, color) {
            if (srcBoard[col][row] !== 0) return { ok: false, msg: 'Giao điểm này đã có quân!' };
            const nextBoard = cloneBoard(srcBoard);
            nextBoard[col][row] = color;
            const enemy = color === 1 ? 2 : 1;
            let capturedCount = 0;

            for (const [dc, dr] of DIRS) {
                const nc = col + dc, nr = row + dr;
                if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE && nextBoard[nc][nr] === enemy) {
                    const { group, liberties } = getGroupAndLiberties(nextBoard, nc, nr);
                    if (liberties === 0) {
                        capturedCount += group.length;
                        for (const [gc, gr] of group) nextBoard[gc][gr] = 0;
                    }
                }
            }

            const selfGroup = getGroupAndLiberties(nextBoard, col, row);
            if (capturedCount === 0 && selfGroup.liberties === 0) return { ok: false, msg: 'Phạm luật: Điểm tự sát!' };
            if (isSameBoard(nextBoard, srcPrevBoard)) return { ok: false, msg: 'Phạm luật Cướp cờ (Ko)!' };

            return { ok: true, nextBoard, capturedCount };
        }

        function hasAnyLegalMove(color) {
            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[c][r] === 0 && simulateMove(board, prevBoard, c, r, color).ok) return true;
                }
            }
            return false;
        }

        function executeMove(col, row, color) {
            const sim = simulateMove(board, prevBoard, col, row, color);
            if (!sim.ok) return sim;

            // Chốt thời gian đã tiêu hao của người vừa đánh và chuyển đồng hồ sang đối thủ
            const elapsed = (Date.now() - lastTurnStartTimestamp) / 1000;
            timeLeft[color] = Math.max(0, timeLeft[color] - elapsed);
            lastTurnStartTimestamp = Date.now();

            prevBoard = cloneBoard(board);
            board = sim.nextBoard;
            captures[color] += sim.capturedCount;
            lastMove = { col, row };
            currentTurn = color === 1 ? 2 : 1;
            passCount = 0;
            return { ok: true };
        }

        function calculateTerritoryScore() {
            const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
            let blackTerritory = 0, whiteTerritory = 0;

            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[c][r] === 0 && !visited[c][r]) {
                        const region = [];
                        const borders = new Set();
                        const queue = [[c, r]];
                        visited[c][r] = true;

                        while (queue.length > 0) {
                            const [cc, cr] = queue.shift();
                            region.push([cc, cr]);
                            for (const [dc, dr] of DIRS) {
                                const nc = cc + dc, nr = cr + dr;
                                if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE) {
                                    if (board[nc][nr] === 0 && !visited[nc][nr]) {
                                        visited[nc][nr] = true;
                                        queue.push([nc, nr]);
                                    } else if (board[nc][nr] !== 0) {
                                        borders.add(board[nc][nr]);
                                    }
                                }
                            }
                        }
                        if (borders.size === 1) {
                            if (borders.has(1)) blackTerritory += region.length;
                            if (borders.has(2)) whiteTerritory += region.length;
                        }
                    }
                }
            }
            return {
                blackTotal: blackTerritory + captures[1],
                whiteTotal: whiteTerritory + captures[2] + 6.5
            };
        }

        function updateUI() {
            document.getElementById('blackCap').innerText = captures[1];
            document.getElementById('whiteCap').innerText = captures[2];
            renderClocks();
        }

        function handlePass() {
            if (isGameOver) return;
            if (isOnline) {
                if (currentTurn === myColor) socket.emit('passTurn', { roomId, username });
            } else {
                const elapsed = (Date.now() - lastTurnStartTimestamp) / 1000;
                timeLeft[currentTurn] = Math.max(0, timeLeft[currentTurn] - elapsed);
                lastTurnStartTimestamp = Date.now();

                passCount++;
                if (passCount >= 2) {
                    isGameOver = true;
                    localStorage.removeItem(LOCAL_STATE_KEY);
                    const res = calculateTerritoryScore();
                    const winText = res.blackTotal > res.whiteTotal ? 'QUÂN ĐEN THẮNG!' : 'QUÂN TRẮNG THẮNG!';
                    showEndScreen(winText, `Đất + Tù binh — Đen: ${res.blackTotal} | Trắng: ${res.whiteTotal} (gồm 6.5 Komi)`, true);
                } else {
                    currentTurn = currentTurn === 1 ? 2 : 1;
                    updateUI();
                    drawBoard();
                    saveLocalState();
                }
            }
        }

        function handleResign() {
            if (isGameOver || !confirm('Bạn chắc chắn muốn đầu hàng?')) return;
            if (isOnline) {
                socket.emit('resignGame', { roomId, username });
            } else {
                isGameOver = true;
                localStorage.removeItem(LOCAL_STATE_KEY);
                showEndScreen(currentTurn === 1 ? 'QUÂN TRẮNG THẮNG!' : 'QUÂN ĐEN THẮNG!', 'Đã đầu hàng', false);
            }
        }

        function showEndScreen(titleText, reasonText, isWin) {
            isGameOver = true;
            const titleEl = document.getElementById('endTitle');
            titleEl.innerText = titleText;
            titleEl.style.color = isWin ? '#2ecc71' : '#e74c3c';
            document.getElementById('endReason').innerText = reasonText;
            document.getElementById('endOverlay').classList.remove('hidden');
        }

        function exitMatch() {
            localStorage.removeItem(LOCAL_STATE_KEY);
            sessionStorage.removeItem('go_roomId');
            window.location.href = '/index1.html';
        }

        // --- ĐỒNG BỘ ONLINE VỚI SERVER.JS ---
        if (isOnline) {
            socket.emit('joinGameRoom', { roomId, username });

            socket.on('syncBoard', (game) => {
                const hadMove = game.lastMove && (!lastMove || game.lastMove.col !== lastMove.col || game.lastMove.row !== lastMove.row);
                board = game.board;
                currentTurn = game.turn;
                if (game.captures) captures = game.captures;
                if (game.lastMove) lastMove = game.lastMove;

                // Nhận quỹ thời gian thật từ Server và reset mốc đếm cục bộ
                if (game.timeLeft) {
                    timeLeft = { 1: Number(game.timeLeft[1]), 2: Number(game.timeLeft[2]) };
                    lastTurnStartTimestamp = Date.now();
                }

                if (hadMove) playMoveSound();
                updateUI();
                drawBoard();
            });

            socket.on('invalidMove', (msg) => alert(msg));

            socket.on('matchOver', ({ winner, reason, winnerNewScore }) => {
                isGameOver = true;
                const isWin = winner === username;
                showEndScreen(isWin ? 'CHIẾN THẮNG! (+1 ĐIỂM)' : 'THẤT BẠI!', reason, isWin);
                if (isWin) sessionStorage.setItem('go_score', winnerNewScore);
                setTimeout(exitMatch, 3500);
            });
        }

        updateUI();
        drawBoard();
    </script>
</body>
</html>
