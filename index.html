<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vây 9x9 - Chuẩn Thi Đấu</title>
    <style>
        body {
            background-color: #18181f;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
            user-select: none;
            min-height: 96vh;
            transition: background 0.3s ease;
        }
        .hud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: rgba(35, 35, 45, 0.92);
            padding: 8px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .stat-box { background: #14141b; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; border: 1px solid #333; }
        .clock-box { font-family: monospace; font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 6px; background: #111; border: 1px solid #444; }
        .clock-active { border-color: #f5b041; box-shadow: 0 0 8px rgba(245, 176, 65, 0.4); }
        .clock-byo { color: #ff6b6b; border-color: #e74c3c; }
        canvas {
            box-shadow: 0 12px 32px rgba(0,0,0,0.85);
            cursor: pointer;
            max-width: 92vw;
            max-height: 76vh;
            border-radius: 8px;
        }
        button { padding: 7px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        button:hover { opacity: 0.88; }
        .btn-pass { background: #f39c12; color: #000; }
        .btn-resign { background: #e74c3c; color: #fff; }
        .btn-sound { background: #27ae60; color: #fff; }

        /* Nút Setting góc dưới bên phải đúng vị trí khung đỏ */
        .btn-setting-corner {
            position: fixed;
            bottom: 18px;
            right: 22px;
            background: rgba(35, 35, 45, 0.95);
            color: #f5b041;
            border: 2px solid #f5b041;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            z-index: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-setting-corner:hover { background: #f5b041; color: #18181f; }

        /* Popup tab bé chứa iframe index2.html */
        .setting-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1500;
        }
        .setting-window {
            width: 440px;
            max-width: 94vw;
            height: 540px;
            max-height: 88vh;
            background: #23232e;
            border: 2px solid #f5b041;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
        }
        .setting-header {
            background: #181820;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #383846;
            font-weight: bold;
            color: #f5b041;
        }
        .setting-window iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #23232e;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000; text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="stat-box" id="playerLabel">Chế độ: Chơi thử 2 người</div>
        <div class="clock-box" id="blackClock">⚫ Đen: 10:00 (3x30s)</div>
        <div class="clock-box" id="whiteClock">⚪ Trắng: 10:00 (3x30s)</div>
        <div class="stat-box" id="turnLabel" style="color: #f5b041; font-weight: bold;">Lượt: Quân Đen</div>
        <div class="stat-box">Nước: <strong id="moveCounter">0</strong>/60 | Tù binh — Đen: <strong id="blackCap">0</strong> | Trắng: <strong id="whiteCap">0</strong></div>
        <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊 Âm thanh</button>
        <button class="btn-pass" onclick="handlePass()">Bỏ Lượt (Pass)</button>
        <button class="btn-resign" onclick="handleResign()">Đầu Hàng</button>
    </div>

    <canvas id="goCanvas" width="1000" height="1000"></canvas>

    <!-- NÚT SETTING Ở GÓC DƯỚI PHẢI -->
    <button class="btn-setting-corner" onclick="openSettings()">⚙️ Setting</button>

    <!-- CỬA SỔ TAB BÉ QUẢN LÝ (INDEX2.HTML) -->
    <div class="setting-modal hidden" id="settingModal" onclick="if(event.target===this) closeSettings()">
        <div class="setting-window">
            <div class="setting-header">
                <span>⚙️ Quản Lý & Cài Đặt Game</span>
                <button onclick="closeSettings()" style="background:#e74c3c; color:#fff; padding:4px 10px;">✕ Đóng</button>
            </div>
            <iframe id="settingFrame" src="/index2.html"></iframe>
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div class="overlay hidden" id="endOverlay">
        <h1 id="endTitle" style="font-size: 44px; margin-bottom: 8px;"></h1>
        <p id="endReason" style="font-size: 18px; color: #ccc; margin-bottom: 24px;"></p>
        <button onclick="exitMatch()" style="padding: 12px 26px; font-size: 16px; background: #2ecc71; color: #000;">Quay về sảnh</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('goCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 9;
        const MARGIN = 115;

        const username = sessionStorage.getItem('go_username');
        const roomId = sessionStorage.getItem('go_roomId');
        const myColor = Number(sessionStorage.getItem('go_color') || 0);
        const opponent = sessionStorage.getItem('go_opponent') || 'Đối thủ';
        const isOnline = Boolean(username && roomId && typeof io !== 'undefined');
        const socket = isOnline ? io() : null;

        if (isOnline) {
            document.getElementById('playerLabel').innerText = `Bạn: ${username} (${myColor === 1 ? 'Đen' : 'Trắng'}) vs ${opponent}`;
        }

        // --- CẤU HÌNH TỪ INDEX2 (LƯU TRONG LOCALSTORAGE) ---
        let settings = {
            sfxVol: Number(localStorage.getItem('go_sfx_vol') ?? 0.8),
            bgmVol: Number(localStorage.getItem('go_bgm_vol') ?? 0.4),
            mainMinutes: Number(localStorage.getItem('go_main_min') ?? 10), // 10 - 15 phút
            byoPeriods: Number(localStorage.getItem('go_byo_periods') ?? 3), // 3 lần
            byoSeconds: Number(localStorage.getItem('go_byo_sec') ?? 30),   // 30 giây
            maxMoves: Number(localStorage.getItem('go_max_moves') ?? 60),    // 40 - 60 nước
            bgDataUrl: localStorage.getItem('go_bg_image') || ''
        };

        // --- HỆ THỐNG ÂM THANH & NHẠC NỀN ---
        let soundEnabled = true;
        const moveSound = new Audio('/sound.mp3');
        const bgmAudio = new Audio();
        bgmAudio.loop = true;
        let audioCtx = null;

        function applySettings() {
            settings.sfxVol = Number(localStorage.getItem('go_sfx_vol') ?? 0.8);
            settings.bgmVol = Number(localStorage.getItem('go_bgm_vol') ?? 0.4);
            settings.mainMinutes = Number(localStorage.getItem('go_main_min') ?? 10);
            settings.byoPeriods = Number(localStorage.getItem('go_byo_periods') ?? 3);
            settings.byoSeconds = Number(localStorage.getItem('go_byo_sec') ?? 30);
            settings.maxMoves = Number(localStorage.getItem('go_max_moves') ?? 60);
            settings.bgDataUrl = localStorage.getItem('go_bg_image') || '';

            moveSound.volume = soundEnabled ? settings.sfxVol : 0;
            bgmAudio.volume = soundEnabled ? settings.bgmVol : 0;

            if (settings.bgDataUrl) {
                document.body.style.backgroundImage = `url('${settings.bgDataUrl}')`;
            } else {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = '#18181f';
            }
            updateUI();
        }

        // Nhận thông báo trực tiếp từ tab bé index2.html khi người chơi điều chỉnh
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            if (e.data.type === 'SETTINGS_UPDATED') {
                applySettings();
                // Nếu ván chưa đánh nước nào thì cập nhật luôn đồng hồ theo cài đặt mới
                if (moveCount === 0) {
                    timers[1] = { main: settings.mainMinutes * 60, periods: settings.byoPeriods, byo: settings.byoSeconds };
                    timers[2] = { main: settings.mainMinutes * 60, periods: settings.byoPeriods, byo: settings.byoSeconds };
                    updateClockDisplay();
                }
            } else if (e.data.type === 'BGM_SELECTED' && e.data.url) {
                bgmAudio.src = e.data.url;
                bgmAudio.volume = soundEnabled ? settings.bgmVol : 0;
                if (soundEnabled) bgmAudio.play().catch(() => {});
            }
        });

        function openSettings() {
            document.getElementById('settingModal').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settingModal').classList.add('hidden');
        }

        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (bgmAudio.src && bgmAudio.paused && soundEnabled) {
                bgmAudio.play().catch(() => {});
            }
        }
        document.addEventListener('pointerdown', unlockAudio, { once: true });

        function playSynthStoneClick() {
            if (settings.sfxVol <= 0) return;
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(750, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.055);
                gain.gain.setValueAtTime(0.45 * settings.sfxVol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.065);
            } catch (e) {}
        }

        function playMoveSound() {
            if (!soundEnabled || settings.sfxVol <= 0) return;
            unlockAudio();
            moveSound.volume = settings.sfxVol;
            moveSound.currentTime = 0;
            const p = moveSound.play();
            if (p !== undefined) {
                p.catch(() => playSynthStoneClick());
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '🔊 Âm thanh' : '🔇 Đã tắt';
            btn.style.background = soundEnabled ? '#27ae60' : '#7f8c8d';
            bgmAudio.volume = soundEnabled ? settings.bgmVol : 0;
            if (soundEnabled) {
                playMoveSound();
                if (bgmAudio.src) bgmAudio.play().catch(() => {});
            } else {
                bgmAudio.pause();
            }
        }

        // --- HỆ THỐNG ĐỒNG HỒ THI ĐẤU 9x9 (10-15 PHÚT + 3x30s BYO-YOMI) ---
        let timers = {
            1: { main: settings.mainMinutes * 60, periods: settings.byoPeriods, byo: settings.byoSeconds },
            2: { main: settings.mainMinutes * 60, periods: settings.byoPeriods, byo: settings.byoSeconds }
        };
        let gameEnded = false;

        function formatClock(t) {
            if (t.main > 0) {
                const m = Math.floor(t.main / 60).toString().padStart(2, '0');
                const s = (t.main % 60).toString().padStart(2, '0');
                return `${m}:${s} (${t.periods}x${settings.byoSeconds}s)`;
            } else {
                return `Byo-yomi: ${t.byo}s (${t.periods} lần)`;
            }
        }

        function updateClockDisplay() {
            const bEl = document.getElementById('blackClock');
            const wEl = document.getElementById('whiteClock');
            bEl.innerText = `⚫ Đen: ${formatClock(timers[1])}`;
            wEl.innerText = `⚪ Trắng: ${formatClock(timers[2])}`;

            bEl.className = 'clock-box' + (currentTurn === 1 ? ' clock-active' : '') + (timers[1].main === 0 ? ' clock-byo' : '');
            wEl.className = 'clock-box' + (currentTurn === 2 ? ' clock-active' : '') + (timers[2].main === 0 ? ' clock-byo' : '');
        }

        setInterval(() => {
            if (gameEnded) return;
            const t = timers[currentTurn];
            if (t.main > 0) {
                t.main--;
            } else {
                t.byo--;
                if (t.byo <= 0) {
                    t.periods--;
                    if (t.periods <= 0) {
                        gameEnded = true;
                        const winnerName = currentTurn === 1 ? 'QUÂN TRẮNG THẮNG!' : 'QUÂN ĐEN THẮNG!';
                        const reason = `${currentTurn === 1 ? 'Quân Đen' : 'Quân Trắng'} đã hết thời gian và 3 lần đếm ngược 30s!`;
                        if (isOnline && currentTurn === myColor) {
                            socket.emit('resignGame', { roomId, username });
                        } else if (!isOnline) {
                            showEndScreen(winnerName, reason, true);
                        }
                        return;
                    } else {
                        t.byo = settings.byoSeconds;
                    }
                }
            }
            updateClockDisplay();
        }, 1000);

        // --- DỮ LIỆU BÀN CỜ 9x9 ---
        let board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        let prevBoard = null;
        let currentTurn = 1;
        let captures = { 1: 0, 2: 0 };
        let lastMove = null;
        let passCount = 0;
        let moveCount = 0;
        let hoverPoint = null;

        const woodImg = new Image();
        woodImg.src = '/wood.png';
        let woodLoaded = false;
        woodImg.onload = () => { woodLoaded = true; drawBoard(); };

        const step = (canvas.width - MARGIN * 2) / (GRID_SIZE - 1);
        const stoneRadius = step * 0.44;
        const COLS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
        const HOSHI = [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]];

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (woodLoaded) {
                ctx.drawImage(woodImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#d7a86e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const start = MARGIN;
            const end = canvas.width - MARGIN;

            ctx.strokeStyle = '#1b130c';
            ctx.lineWidth = 4.5;
            ctx.strokeRect(start - 10, start - 10, (end - start) + 20, (end - start) + 20);

            ctx.lineWidth = 2.4;
            for (let i = 0; i < GRID_SIZE; i++) {
                const pos = start + i * step;
                ctx.beginPath(); ctx.moveTo(pos, start); ctx.lineTo(pos, end); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(start, pos); ctx.lineTo(end, pos); ctx.stroke();
            }

            ctx.fillStyle = '#1b130c';
            for (const [hc, hr] of HOSHI) {
                ctx.beginPath();
                ctx.arc(start + hc * step, start + hr * step, 7.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < GRID_SIZE; i++) {
                const pos = start + i * step;
                ctx.fillText(COLS[i], pos, start - 54);
                ctx.fillText(COLS[i], pos, end + 54);
                const rowLabel = String(GRID_SIZE - i);
                ctx.fillText(rowLabel, start - 54, pos);
                ctx.fillText(rowLabel, end + 54, pos);
            }

            if (hoverPoint && !gameEnded && board[hoverPoint.col][hoverPoint.row] === 0) {
                drawStone(start + hoverPoint.col * step, start + hoverPoint.row * step, currentTurn, true);
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    const stone = board[c][r];
                    if (stone !== 0) {
                        const cx = start + c * step;
                        const cy = start + r * step;
                        drawStone(cx, cy, stone, false);
                        if (lastMove && lastMove.col === c && lastMove.row === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, stoneRadius * 0.24, 0, Math.PI * 2);
                            ctx.fillStyle = '#e74c3c';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        function drawStone(x, y, color, isGhost) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, stoneRadius, 0, Math.PI * 2);
            if (isGhost) {
                ctx.fillStyle = color === 1 ? 'rgba(20, 20, 20, 0.42)' : 'rgba(255, 255, 255, 0.55)';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.stroke();
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 6;
                const grad = ctx.createRadialGradient(
                    x - stoneRadius * 0.3, y - stoneRadius * 0.3, stoneRadius * 0.1,
                    x, y, stoneRadius
                );
                if (color === 1) {
                    grad.addColorStop(0, '#5a5a5a');
                    grad.addColorStop(0.3, '#1d1d1d');
                    grad.addColorStop(1, '#050505');
                } else {
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.75, '#ebebeb');
                    grad.addColorStop(1, '#bdbdbd');
                }
                ctx.fillStyle = grad;
                ctx.fill();
            }
            ctx.restore();
        }

        function getNearestPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);
            const col = Math.round((x - MARGIN) / step);
            const row = Math.round((y - MARGIN) / step);

            if (col >= 0 && col < GRID_SIZE && row >= 0 && row < GRID_SIZE) {
                const dist = Math.hypot(x - (MARGIN + col * step), y - (MARGIN + row * step));
                if (dist <= step * 0.75) return { col, row };
            }
            return null;
        }

        canvas.addEventListener('mousemove', (e) => {
            if (gameEnded || (isOnline && currentTurn !== myColor)) {
                hoverPoint = null;
                return;
            }
            const pt = getNearestPoint(e.clientX, e.clientY);
            if (JSON.stringify(pt) !== JSON.stringify(hoverPoint)) {
                hoverPoint = pt;
                drawBoard();
            }
        });

        canvas.addEventListener('mouseleave', () => { hoverPoint = null; drawBoard(); });

        canvas.addEventListener('click', (e) => {
            if (gameEnded || (isOnline && currentTurn !== myColor)) return;
            const pt = getNearestPoint(e.clientX, e.clientY);
            if (!pt) return;

            if (isOnline) {
                socket.emit('playMove', { roomId, col: pt.col, row: pt.row, username });
            } else {
                const res = executeMove(pt.col, pt.row, currentTurn);
                if (!res.ok) return alert(res.msg);
                playMoveSound();
                hoverPoint = null;
                updateUI();
                drawBoard();
                checkMoveLimitEnd();
            }
        });

        // --- LUẬT CỜ VÂY 9x9 ---
        const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        const cloneBoard = (b) => b.map(r => [...r]);
        const isSameBoard = (b1, b2) => b1 && b2 && JSON.stringify(b1) === JSON.stringify(b2);

        function getGroupAndLiberties(targetBoard, startCol, startRow) {
            const color = targetBoard[startCol][startRow];
            const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
            const group = [];
            const liberties = new Set();
            const queue = [[startCol, startRow]];
            visited[startCol][startRow] = true;

            while (queue.length > 0) {
                const [c, r] = queue.shift();
                group.push([c, r]);
                for (const [dc, dr] of DIRS) {
                    const nc = c + dc, nr = r + dr;
                    if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE) {
                        if (targetBoard[nc][nr] === 0) liberties.add(`${nc},${nr}`);
                        else if (targetBoard[nc][nr] === color && !visited[nc][nr]) {
                            visited[nc][nr] = true;
                            queue.push([nc, nr]);
                        }
                    }
                }
            }
            return { group, liberties: liberties.size };
        }

        function executeMove(col, row, color) {
            if (board[col][row] !== 0) return { ok: false, msg: 'Giao điểm này đã có quân!' };
            const nextBoard = cloneBoard(board);
            nextBoard[col][row] = color;
            const enemy = color === 1 ? 2 : 1;
            let capturedCount = 0;

            for (const [dc, dr] of DIRS) {
                const nc = col + dc, nr = row + dr;
                if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE && nextBoard[nc][nr] === enemy) {
                    const { group, liberties } = getGroupAndLiberties(nextBoard, nc, nr);
                    if (liberties === 0) {
                        capturedCount += group.length;
                        for (const [gc, gr] of group) nextBoard[gc][gr] = 0;
                    }
                }
            }

            const selfGroup = getGroupAndLiberties(nextBoard, col, row);
            if (capturedCount === 0 && selfGroup.liberties === 0) return { ok: false, msg: 'Phạm luật: Nước đi tự sát!' };
            if (isSameBoard(nextBoard, prevBoard)) return { ok: false, msg: 'Phạm luật Cướp cờ (Ko)!' };

            // Nếu đang ở chế độ đếm ngược Byo-yomi, đánh xong 1 nước thì hồi lại 30 giây cho lần đó
            if (timers[color].main === 0) {
                timers[color].byo = settings.byoSeconds;
            }

            prevBoard = cloneBoard(board);
            board = nextBoard;
            captures[color] += capturedCount;
            lastMove = { col, row };
            currentTurn = enemy;
            passCount = 0;
            moveCount++;
            return { ok: true };
        }

        function calculateTerritoryScore() {
            const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
            let blackTerritory = 0, whiteTerritory = 0;

            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[c][r] === 0 && !visited[c][r]) {
                        const region = [];
                        const borders = new Set();
                        const queue = [[c, r]];
                        visited[c][r] = true;

                        while (queue.length > 0) {
                            const [cc, cr] = queue.shift();
                            region.push([cc, cr]);
                            for (const [dc, dr] of DIRS) {
                                const nc = cc + dc, nr = cr + dr;
                                if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE) {
                                    if (board[nc][nr] === 0 && !visited[nc][nr]) {
                                        visited[nc][nr] = true;
                                        queue.push([nc, nr]);
                                    } else if (board[nc][nr] !== 0) {
                                        borders.add(board[nc][nr]);
                                    }
                                }
                            }
                        }
                        if (borders.size === 1) {
                            if (borders.has(1)) blackTerritory += region.length;
                            if (borders.has(2)) whiteTerritory += region.length;
                        }
                    }
                }
            }
            return {
                blackTotal: blackTerritory + captures[1],
                whiteTotal: whiteTerritory + captures[2] + 6.5
            };
        }

        function checkMoveLimitEnd() {
            if (moveCount >= settings.maxMoves && !gameEnded) {
                gameEnded = true;
                const res = calculateTerritoryScore();
                const winText = res.blackTotal > res.whiteTotal ? 'QUÂN ĐEN THẮNG!' : 'QUÂN TRẮNG THẮNG!';
                const reason = `Đạt giới hạn ${settings.maxMoves} nước đi — Đen: ${res.blackTotal} | Trắng: ${res.whiteTotal} (gồm 6.5 Komi)`;
                if (isOnline) {
                    socket.emit('passTurn', { roomId, username });
                } else {
                    showEndScreen(winText, reason, true);
                }
            }
        }

        function updateUI() {
            document.getElementById('blackCap').innerText = captures[1];
            document.getElementById('whiteCap').innerText = captures[2];
            document.getElementById('moveCounter').innerText = `${moveCount}/${settings.maxMoves}`;
            if (isOnline) {
                document.getElementById('turnLabel').innerText = currentTurn === myColor ? '👉 ĐẾN LƯỢT BẠN' : '⏳ Chờ đối thủ...';
            } else {
                document.getElementById('turnLabel').innerText = currentTurn === 1 ? 'Lượt: Quân Đen' : 'Lượt: Quân Trắng';
            }
            updateClockDisplay();
        }

        function handlePass() {
            if (gameEnded) return;
            if (isOnline) {
                if (currentTurn === myColor) socket.emit('passTurn', { roomId, username });
            } else {
                passCount++;
                if (passCount >= 2) {
                    gameEnded = true;
                    const res = calculateTerritoryScore();
                    const winText = res.blackTotal > res.whiteTotal ? 'QUÂN ĐEN THẮNG!' : 'QUÂN TRẮNG THẮNG!';
                    showEndScreen(winText, `Đất + Tù binh — Đen: ${res.blackTotal} | Trắng: ${res.whiteTotal} (gồm 6.5 Komi)`, true);
                } else {
                    alert(`${currentTurn === 1 ? 'Đen' : 'Trắng'} đã bỏ lượt!`);
                    currentTurn = currentTurn === 1 ? 2 : 1;
                    updateUI();
                    drawBoard();
                }
            }
        }

        function handleResign() {
            if (gameEnded || !confirm('Bạn chắc chắn muốn đầu hàng?')) return;
            gameEnded = true;
            if (isOnline) socket.emit('resignGame', { roomId, username });
            else showEndScreen(currentTurn === 1 ? 'QUÂN TRẮNG THẮNG!' : 'QUÂN ĐEN THẮNG!', 'Đã đầu hàng', false);
        }

        function showEndScreen(titleText, reasonText, isWin) {
            const titleEl = document.getElementById('endTitle');
            titleEl.innerText = titleText;
            titleEl.style.color = isWin ? '#2ecc71' : '#e74c3c';
            document.getElementById('endReason').innerText = reasonText;
            document.getElementById('endOverlay').classList.remove('hidden');
        }

        function exitMatch() {
            sessionStorage.removeItem('go_roomId');
            window.location.href = '/index1.html';
        }

        if (isOnline) {
            socket.emit('joinGameRoom', { roomId, username });
            socket.on('syncBoard', (game) => {
                const isNewMove = game.lastMove && (!lastMove || game.lastMove.col !== lastMove.col || game.lastMove.row !== lastMove.row);
                board = game.board;
                currentTurn = game.turn;
                if (game.captures) captures = game.captures;
                if (game.lastMove) {
                    lastMove = game.lastMove;
                    moveCount++;
                    const prevPlayer = currentTurn === 1 ? 2 : 1;
                    if (timers[prevPlayer].main === 0) timers[prevPlayer].byo = settings.byoSeconds;
                }
                if (isNewMove) playMoveSound();
                updateUI();
                drawBoard();
                checkMoveLimitEnd();
            });
            socket.on('invalidMove', (msg) => alert(msg));
            socket.on('matchOver', ({ winner, reason, winnerNewScore }) => {
                gameEnded = true;
                const isWin = winner === username;
                showEndScreen(isWin ? 'CHIẾN THẮNG! (+1 ĐIỂM)' : 'THẤT BẠI!', reason, isWin);
                if (isWin) sessionStorage.setItem('go_score', winnerNewScore);
                setTimeout(exitMatch, 3500);
            });
        }

        applySettings();
        drawBoard();
    </script>
</body>
