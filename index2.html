<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cài Đặt Game Cờ Vây</title>
    <style>
        body {
            background: #22222c;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        h3 { margin: 0 0 14px 0; color: #f5b041; font-size: 18px; border-bottom: 1px solid #3a3a4a; padding-bottom: 8px; }
        .section {
            background: #181820;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #2e2e3d;
        }
        .section-title { font-weight: bold; font-size: 14px; color: #f5b041; margin-bottom: 8px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
        input[type="range"] { width: 170px; accent-color: #f5b041; cursor: pointer; }
        input[type="file"] { font-size: 12px; color: #ccc; max-width: 210px; }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            background: #4a4a5e;
            color: #fff;
        }
        button:hover { opacity: 0.85; }
        .btn-danger { background: #e74c3c; }
    </style>
</head>
<body>
    <h3>⚙️ Cài Đặt Trò Chơi</h3>

    <!-- 1. ÂM LƯỢNG HIỆU ỨNG -->
    <div class="section">
        <div class="section-title">🔊 1. Âm Lượng Hiệu Ứng Đặt Quân</div>
        <div class="row">
            <span>Âm lượng: <b id="sfxText">80%</b></span>
            <input type="range" id="sfxRange" min="0" max="100" value="80" oninput="updateAudio()">
        </div>
    </div>

    <!-- 2. NHẠC NỀN GAME -->
    <div class="section">
        <div class="section-title">🎵 2. Nhạc Nền Game (Tự Chọn File)</div>
        <div class="row">
            <input type="file" id="bgmFile" accept="audio/*" onchange="uploadBgm(this)">
            <button class="btn-danger" onclick="clearBgm()">Xóa nhạc</button>
        </div>
        <div id="bgmStatus" style="font-size: 12px; color: #2ecc71; margin-bottom: 6px;"></div>
        <div class="row">
            <span>Âm lượng nhạc nền: <b id="bgmText">40%</b></span>
            <input type="range" id="bgmRange" min="0" max="100" value="40" oninput="updateAudio()">
        </div>
    </div>

    <!-- 3. HÌNH NỀN BACKGROUND -->
    <div class="section">
        <div class="section-title">🖼️ 3. Hình Nền (Background Bên Ngoài)</div>
        <div class="row">
            <input type="file" id="bgFile" accept="image/*" onchange="uploadBg(this)">
            <button class="btn-danger" onclick="clearBg()">Mặc định</button>
        </div>
        <div id="bgStatus" style="font-size: 12px; color: #2ecc71;"></div>
    </div>

    <script>
        function notifyParent() {
            if (window.parent) window.parent.postMessage('settingsUpdated', '*');
        }

        function loadSaved() {
            const sfx = Math.round((Number(localStorage.getItem('go_sfxVol') ?? 0.8)) * 100);
            const bgm = Math.round((Number(localStorage.getItem('go_bgmVol') ?? 0.4)) * 100);
            document.getElementById('sfxRange').value = sfx;
            document.getElementById('sfxText').innerText = sfx + '%';
            document.getElementById('bgmRange').value = bgm;
            document.getElementById('bgmText').innerText = bgm + '%';

            if (localStorage.getItem('go_bgmName')) {
                document.getElementById('bgmStatus').innerText = 'Đang dùng: ' + localStorage.getItem('go_bgmName');
            }
            if (localStorage.getItem('go_bgImgData')) {
                document.getElementById('bgStatus').innerText = '✅ Đã áp dụng ảnh nền tùy chỉnh';
            }
        }

        function updateAudio() {
            const sfx = document.getElementById('sfxRange').value;
            const bgm = document.getElementById('bgmRange').value;
            document.getElementById('sfxText').innerText = sfx + '%';
            document.getElementById('bgmText').innerText = bgm + '%';
            localStorage.setItem('go_sfxVol', sfx / 100);
            localStorage.setItem('go_bgmVol', bgm / 100);
            notifyParent();
        }

        function uploadBgm(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 4.5 * 1024 * 1024) {
                alert('File nhạc hơi lớn (>4.5MB), hãy chọn file nhẹ hơn để lưu mượt trên trình duyệt!');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('go_bgmData', e.target.result);
                localStorage.setItem('go_bgmName', file.name);
                document.getElementById('bgmStatus').innerText = 'Đang dùng: ' + file.name;
                notifyParent();
            };
            reader.readAsDataURL(file);
        }

        function clearBgm() {
            localStorage.removeItem('go_bgmData');
            localStorage.removeItem('go_bgmName');
            document.getElementById('bgmStatus').innerText = 'Đã tắt nhạc nền';
            notifyParent();
        }

        function uploadBg(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('go_bgImgData', e.target.result);
                document.getElementById('bgStatus').innerText = '✅ Đã áp dụng ảnh nền tùy chỉnh';
                notifyParent();
            };
            reader.readAsDataURL(file);
        }

        function clearBg() {
            localStorage.removeItem('go_bgImgData');
            document.getElementById('bgStatus').innerText = 'Đã trả về nền mặc định';
            notifyParent();
        }

        loadSaved();
    </script>
</body>
</html>
