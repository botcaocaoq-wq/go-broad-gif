<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cài Đặt Game Cờ Vây</title>
    <style>
        body {
            background: #1c1c24;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 14px;
            user-select: none;
        }
        .owner-banner {
            background: #14141b;
            border-left: 3px solid #2ecc71;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #a0a0b0;
            margin-bottom: 12px;
        }
        .section {
            background: #272733;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #383846;
        }
        .section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #f5b041;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 6px 0;
            font-size: 13px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #f5b041;
            cursor: pointer;
        }
        input[type="file"] {
            font-size: 12px;
            color: #ccc;
            max-width: 195px;
        }
        button {
            padding: 6px 11px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-clear { background: #e74c3c; color: #fff; }
        .status-msg { font-size: 12px; color: #2ecc71; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="owner-banner">
        Hồ sơ cài đặt độc lập của: <strong id="userDisplay" style="color:#fff;">guest</strong>
    </div>

    <!-- 1. Âm lượng hiệu ứng đặt quân -->
    <div class="section">
        <h3>🔊 1. Âm Lượng Hiệu Ứng Đặt Quân</h3>
        <div class="row">
            <span>Âm lượng: <strong id="sfxText">100%</strong></span>
            <input type="range" id="sfxSlider" min="0" max="100" value="100">
        </div>
    </div>

    <!-- 2. Nhạc nền tự chọn -->
    <div class="section">
        <h3>🎵 2. Nhạc Nền Game (Tự Chọn File)</h3>
        <div class="row">
            <input type="file" id="bgmFile" accept="audio/*">
            <button class="btn-clear" onclick="clearBgm()">Xóa nhạc</button>
        </div>
        <div class="row" style="margin-top: 8px;">
            <span>Âm lượng nhạc: <strong id="bgmText">60%</strong></span>
            <input type="range" id="bgmSlider" min="0" max="100" value="60">
        </div>
        <div class="status-msg" id="bgmStatus"></div>
    </div>

    <!-- 3. Hình nền Background bên ngoài -->
    <div class="section">
        <h3>🖼️ 3. Hình Nền (Background Bên Ngoài)</h3>
        <div class="row">
            <input type="file" id="bgFile" accept="image/*">
            <button class="btn-clear" onclick="clearBg()">Mặc định</button>
        </div>
        <div class="status-msg" id="bgStatus"></div>
    </div>

    <script>
        // Lấy đúng tên tài khoản của người chơi mở bảng này để lưu cài đặt độc lập
        const params = new URLSearchParams(window.location.search);
        const currentUser = params.get('user') || sessionStorage.getItem('go_username') || 'guest';
        const USER_PREFIX = `go_cfg_${currentUser}_`;

        document.getElementById('userDisplay').innerText = currentUser;

        function notifyGame() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'GO_SETTINGS_UPDATED', user: currentUser }, '*');
            }
        }

        // Khôi phục cài đặt riêng của tài khoản này
        const sfxSlider = document.getElementById('sfxSlider');
        const sfxText = document.getElementById('sfxText');
        const savedSfx = localStorage.getItem(USER_PREFIX + 'sfxVol');
        if (savedSfx !== null) {
            sfxSlider.value = Math.round(Number(savedSfx) * 100);
            sfxText.innerText = sfxSlider.value + '%';
        }

        sfxSlider.addEventListener('input', () => {
            sfxText.innerText = sfxSlider.value + '%';
            localStorage.setItem(USER_PREFIX + 'sfxVol', sfxSlider.value / 100);
            notifyGame();
        });

        const bgmSlider = document.getElementById('bgmSlider');
        const bgmText = document.getElementById('bgmText');
        const savedBgmVol = localStorage.getItem(USER_PREFIX + 'bgmVol');
        if (savedBgmVol !== null) {
            bgmSlider.value = Math.round(Number(savedBgmVol) * 100);
            bgmText.innerText = bgmSlider.value + '%';
        }
        if (localStorage.getItem(USER_PREFIX + 'bgmData')) {
            document.getElementById('bgmStatus').innerText = '✅ Đã nạp nhạc nền riêng';
        }

        bgmSlider.addEventListener('input', () => {
            bgmText.innerText = bgmSlider.value + '%';
            localStorage.setItem(USER_PREFIX + 'bgmVol', bgmSlider.value / 100);
            notifyGame();
        });

        document.getElementById('bgmFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 4.5 * 1024 * 1024) {
                alert('File nhạc hơi lớn (>4.5MB), hãy chọn file nhẹ hơn để lưu mượt trên trình duyệt!');
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    localStorage.setItem(USER_PREFIX + 'bgmData', reader.result);
                    document.getElementById('bgmStatus').innerText = '✅ Đang phát: ' + file.name;
                    notifyGame();
                } catch (err) {
                    alert('Bộ nhớ trình duyệt đầy, hãy chọn file nhạc dung lượng nhỏ hơn!');
                }
            };
            reader.readAsDataURL(file);
        });

        function clearBgm() {
            localStorage.removeItem(USER_PREFIX + 'bgmData');
            document.getElementById('bgmFile').value = '';
            document.getElementById('bgmStatus').innerText = 'Đã tắt nhạc nền';
            notifyGame();
        }

        if (localStorage.getItem(USER_PREFIX + 'bgImg')) {
            document.getElementById('bgStatus').innerText = '✅ Đã áp dụng ảnh nền riêng';
        }

        document.getElementById('bgFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    localStorage.setItem(USER_PREFIX + 'bgImg', reader.result);
                    document.getElementById('bgStatus').innerText = '✅ Đã đổi nền: ' + file.name;
                    notifyGame();
                } catch (err) {
                    alert('Ảnh nền quá nặng, hãy chọn ảnh nhẹ hơn (<3MB)!');
                }
            };
            reader.readAsDataURL(file);
        });

        function clearBg() {
            localStorage.removeItem(USER_PREFIX + 'bgImg');
            document.getElementById('bgFile').value = '';
            document.getElementById('bgStatus').innerText = 'Đã về nền mặc định';
            notifyGame();
        }
    </script>
</body>
</html>
