<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cài Đặt Game Cờ Vây</title>
    <style>
        body {
            background: #1e1e26;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 14px;
            box-sizing: border-box;
        }
        .section {
            background: #2b2b36;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #3a3a4a;
        }
        .section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #5dade2;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            font-size: 13px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #f5b041;
            cursor: pointer;
        }
        input[type="file"] {
            font-size: 12px;
            color: #ccc;
            max-width: 195px;
        }
        button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-clear { background: #e74c3c; color: #fff; }
        .status-text { font-size: 12px; color: #2ecc71; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="section">
        <h3>🔊 1. Âm Lượng Hiệu Ứng Đặt Quân</h3>
        <div class="row">
            <span>Âm lượng: <strong id="sfxLabel">100%</strong></span>
            <input type="range" id="sfxRange" min="0" max="100" value="100" oninput="updateSfx(this.value)">
        </div>
    </div>

    <div class="section">
        <h3>🎵 2. Nhạc Nền Game (Tự Chọn File)</h3>
        <div class="row">
            <input type="file" id="bgmFile" accept="audio/*" onchange="uploadBgm(this)">
            <button class="btn-clear" onclick="clearBgm()">Xóa nhạc</button>
        </div>
        <div class="row" style="margin-top: 10px;">
            <span>Âm lượng nhạc nền: <strong id="bgmLabel">50%</strong></span>
            <input type="range" id="bgmRange" min="0" max="100" value="50" oninput="updateBgmVol(this.value)">
        </div>
        <div class="status-text" id="bgmStatus"></div>
    </div>

    <div class="section">
        <h3>🖼️ 3. Hình Nền (Background Bên Ngoài)</h3>
        <div class="row">
            <input type="file" id="bgFile" accept="image/*" onchange="uploadBg(this)">
            <button class="btn-clear" onclick="clearBg()">Mặc định</button>
        </div>
        <div class="status-text" id="bgStatus"></div>
    </div>

    <script>
        function notifyParent() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('settingsUpdated', '*');
            }
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage('settingsUpdated', '*');
            }
        }

        const savedSfx = localStorage.getItem('go_sfx_vol');
        if (savedSfx !== null) {
            document.getElementById('sfxRange').value = savedSfx;
            document.getElementById('sfxLabel').innerText = savedSfx + '%';
        }

        const savedBgmVol = localStorage.getItem('go_bgm_vol');
        if (savedBgmVol !== null) {
            document.getElementById('bgmRange').value = savedBgmVol;
            document.getElementById('bgmLabel').innerText = savedBgmVol + '%';
        }

        if (localStorage.getItem('go_bgm_data')) {
            document.getElementById('bgmStatus').innerText = '✅ Đang dùng file nhạc nền tùy chỉnh';
        }
        if (localStorage.getItem('go_custom_bg')) {
            document.getElementById('bgStatus').innerText = '✅ Đã áp dụng ảnh nền tùy chỉnh';
        }

        function updateSfx(val) {
            document.getElementById('sfxLabel').innerText = val + '%';
            localStorage.setItem('go_sfx_vol', val);
            notifyParent();
        }

        function updateBgmVol(val) {
            document.getElementById('bgmLabel').innerText = val + '%';
            localStorage.setItem('go_bgm_vol', val);
            notifyParent();
        }

        function uploadBgm(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 4.5 * 1024 * 1024) {
                alert('File nhạc hơi lớn (> 4.5MB), hãy chọn file ngắn/nhẹ hơn để trình duyệt lưu mượt nhé!');
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    localStorage.setItem('go_bgm_data', reader.result);
                    document.getElementById('bgmStatus').innerText = '✅ Đã bật nhạc nền: ' + file.name;
                    notifyParent();
                } catch (e) {
                    alert('Bộ nhớ trình duyệt đầy, vui lòng chọn file nhạc dung lượng nhỏ hơn!');
                }
            };
            reader.readAsDataURL(file);
        }

        function clearBgm() {
            localStorage.removeItem('go_bgm_data');
            document.getElementById('bgmFile').value = '';
            document.getElementById('bgmStatus').innerText = 'Đã tắt nhạc nền tùy chỉnh';
            notifyParent();
        }

        function uploadBg(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    localStorage.setItem('go_custom_bg', reader.result);
                    document.getElementById('bgStatus').innerText = '✅ Đã áp dụng ảnh nền tùy chỉnh';
                    notifyParent();
                } catch (e) {
                    alert('Ảnh nền dung lượng quá lớn, hãy chọn ảnh nhẹ hơn (< 4MB)!');
                }
            };
            reader.readAsDataURL(file);
        }

        function clearBg() {
            localStorage.removeItem('go_custom_bg');
            document.getElementById('bgFile').value = '';
            document.getElementById('bgStatus').innerText = 'Đã khôi phục nền mặc định';
            notifyParent();
        }
    </script>
</body>
</html>
